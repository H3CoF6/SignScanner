[package]
name = "SignScanner"
version = "0.1.1"
edition = "2024"
description = "Statically locate the QQ wrapper.node sign function via stable RTTI/name anchors (no byte signatures)."

[lib]
name = "signscanner"
path = "src/lib.rs"

[[bin]]
name = "signscanner"
path = "src/main.rs"

[dependencies]
iced-x86 = "1.21"
memmap2 = "0.9"

# CLI + 彩色 TUI（与 qqshark 同款配色栈）
clap = { version = "4", features = ["derive"] }
anstream = "0.6"
anstyle = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
